services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: greet
      POSTGRES_PASSWORD: greet
      POSTGRES_DB: greetings_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greet -d greetings_test"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s
    volumes:
      - greetings-test-data:/var/lib/postgresql/data

volumes:
  greetings-test-data:
