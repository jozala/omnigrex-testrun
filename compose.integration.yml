services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: greetings_test
      POSTGRES_PASSWORD: greetings_test
      POSTGRES_DB: greetings_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greetings_test -d greetings_test"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    volumes:
      - greetings-test-data:/var/lib/postgresql/data

volumes:
  greetings-test-data:
